# MikroTik App definition for nibe-hub (RouterOS 7.26+ with the container package).
#
# This file contains no secrets and can be added as it is:
#   /app/add yaml=[/file/get nibe-hub.yaml contents]
# Then fill in the empty values below on the router before /app/enable. Until they are set,
# both services stop at startup with a message saying what is missing:
#   collector: NIBE_URL, NIBE_USER, NIBE_PASS, NIBE_TLS_FINGERPRINT
#   mcp:       MCP_TOKEN, and the certificate and key in the configs mcp-tls-cert and mcp-tls-key
# Alternatively, python3 tools/make_app_yaml.py --cert cert.pem --key key.pem fills them in from
# .env and writes mikrotik/nibe-hub-local.yaml (git-ignored, because it then contains the
# pump password, the MCP token and the TLS key).
#
# Both services share one VETH on an existing bridge, so the MCP server is reachable at that
# VETH's own address on port 443, next to the router's own HTTPS. Give the address a static
# DHCP lease (see README, "RB5009 as a MikroTik App").
#
# `lan` below is the bridge set as lan-bridge in /app/settings; put a bridge name there to use
# another bridge. For a VLAN on a vlan-filtering bridge, set the app property network-pvid
# after /app/add and before /app/enable: /app/set nibe-hub network-pvid=<vlan-id>
# (it is not a YAML field).

name: nibe-hub
descr: NIBE S735C heat pump history - collector and read-only MCP server
# free-form group in the app list (the documentation shows "networking" and "development")
category: networking
supported-archs:
  - arm64

networks:
  default:
    name: lan
    external: true

volumes:
  data:

# The MCP server's HTTPS certificate (its subjectAltName must contain the app's IP) and its
# unencrypted private key, in PEM format. Replace each placeholder line with the whole PEM file.
configs:
  mcp-tls-cert:
    content: |
      replace this line with the PEM certificate for the app's address (cert.pem)
  mcp-tls-key:
    content: |
      replace this line with the PEM private key for that certificate (key.pem)

services:
  # The only writer of the database. Talks to the pump with GET requests only.
  collector:
    image: ghcr.io/kkerssem/nibe-hub:latest
    command: /nibe-collector
    restart: always
    # healthy while the last successful poll of the pump is recent (at most 3 poll intervals);
    # the image has no shell or wget, so the binary checks itself
    healthcheck:
      test: ["CMD", "/nibe-collector", "health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    volumes:
      - data:/data
    environment:
      DB_PATH: /data/nibe.db
      # the pump's local REST API, e.g. https://192.168.1.50:8443 (menu 7.5.15 on the pump)
      NIBE_URL: ""
      # user name and password set in menu 7.5.15
      NIBE_USER: ""
      NIBE_PASS: ""
      # SHA-256 fingerprint of the pump's self-signed certificate (see README)
      NIBE_TLS_FINGERPRINT: ""
      # optional: poll interval in seconds (default 60, minimum 10)
      NIBE_POLL_SECS: "60"
      # optional: points polled more often, here compressor and unit power, every NIBE_FAST_SECS
      NIBE_FAST_IDS: "1801,22130"
      NIBE_FAST_SECS: "10"
      RUST_LOG: info

  # Read-only MCP server over HTTPS on port 443 of the app's address.
  mcp:
    image: ghcr.io/kkerssem/nibe-hub:latest
    command: /nibe-mcp
    restart: always
    # healthy while the server accepts connections on port 443
    healthcheck:
      test: ["CMD", "/nibe-mcp", "health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      - collector
    volumes:
      - data:/data
    configs:
      - source: mcp-tls-cert
        target: /tls/cert.pem
        mode: 0444
      - source: mcp-tls-key
        target: /tls/key.pem
        mode: 0400
    environment:
      DB_PATH: /data/nibe.db
      MCP_BIND: 0.0.0.0:443
      MCP_TLS_CERT: /tls/cert.pem
      MCP_TLS_KEY: /tls/key.pem
      # bearer token for Claude, e.g. from: openssl rand -hex 32
      MCP_TOKEN: ""
      # time zone for timestamps and day buckets
      TZ_NAME: Europe/Amsterdam
      RUST_LOG: info
